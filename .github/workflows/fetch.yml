# משיכת נתונים מרשתות חיצוניות, בהפעלה ידנית (workflow_dispatch).
# התוצאה נשמרת כ-commit על אותו branch שממנו הופעל ה-workflow.
name: fetch

on:
  workflow_dispatch:
    inputs:
      task:
        description: "מה למשוך"
        required: true
        type: choice
        options:
          - wikipedia
          - gsi-probe

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: wikipedia
        if: inputs.task == 'wikipedia'
        run: python scripts/fetch_wikipedia.py

      - name: gsi-probe
        if: inputs.task == 'gsi-probe'
        run: |
          mkdir -p data/raw/gsi
          UA="riftmemory/0.1 (https://github.com/nadaval56/riftmemory)"
          curl -sSL -A "$UA" -D data/raw/gsi/page.headers \
            -o data/raw/gsi/ageEarthquakes.html \
            https://eq.gsi.gov.il/heb/earthquake/ageEarthquakes.php || true
          ls -la data/raw/gsi
          grep -oiE 'href="[^"]*"' data/raw/gsi/ageEarthquakes.html | sort -u | head -100 || true

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fetch: ${{ inputs.task }}"
            git push
          fi
