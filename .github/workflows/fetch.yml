# משיכת נתונים מרשתות חיצוניות. התוצאה נשמרת כ-commit על אותו branch.
# הפעלה: ידנית (workflow_dispatch), או push של .github/fetch-request
# (שם משימה בכל שורה) ל-branch שאינו main.
name: fetch

on:
  push:
    branches-ignore: [main]
    paths: [.github/fetch-request]
  workflow_dispatch:
    inputs:
      task:
        description: "מה למשוך"
        required: true
        type: choice
        options:
          - wikipedia
          - gsi-probe

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: task
        run: |
          if [ -n "${{ inputs.task }}" ]; then
            echo "tasks=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          else
            echo "tasks=$(tr -s '[:space:]' ' ' < .github/fetch-request)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: wikipedia
        if: contains(steps.task.outputs.tasks, 'wikipedia')
        run: python scripts/fetch_wikipedia.py

      # טקסטים ראשוניים בנחלת הכלל (מקרא, ספרות חז"ל, יוסף בן מתתיהו בתרגום וויסטון,
      # ספרי מסע מהמאה ה-19) לבדיקת ציטוטים. נשמרים כמו שהם, בלי הצפנה.
      - name: texts
        if: contains(steps.task.outputs.tasks, 'texts')
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          python scripts/fetch_research.py data/raw/texts .github/text-urls.txt

      - name: gsi-probe
        if: contains(steps.task.outputs.tasks, 'gsi-probe')
        run: python scripts/probe_gsi.py

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fetch: ${{ steps.task.outputs.tasks }}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
