# משיכת נתונים מרשתות חיצוניות. התוצאה נשמרת כ-commit על אותו branch.
# הפעלה: ידנית (workflow_dispatch), או push של .github/fetch-request
# (שם משימה בכל שורה) ל-branch שאינו main.
name: fetch

on:
  push:
    branches-ignore: [main]
    paths: [.github/fetch-request]
  workflow_dispatch:
    inputs:
      task:
        description: "מה למשוך"
        required: true
        type: choice
        options:
          - wikipedia
          - gsi-probe

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: task
        run: |
          if [ -n "${{ inputs.task }}" ]; then
            echo "tasks=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          else
            echo "tasks=$(tr -s '[:space:]' ' ' < .github/fetch-request)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: wikipedia
        if: contains(steps.task.outputs.tasks, 'wikipedia')
        run: python scripts/fetch_wikipedia.py

      - name: gsi-probe
        if: contains(steps.task.outputs.tasks, 'gsi-probe')
        run: |
          mkdir -p data/raw/gsi
          cd data/raw/gsi
          UA="riftmemory/0.1 (https://github.com/nadaval56/riftmemory)"
          curl -sSL -A "$UA" -D page.headers -o ageEarthquakes.html \
            https://eq.gsi.gov.il/heb/earthquake/ageEarthquakes.php || echo "gsi failed"
          curl -sSL -A "$UA" -o usgs-sample.json \
            "https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&minlatitude=27&maxlatitude=36&minlongitude=32&maxlongitude=38&minmagnitude=2&orderby=time&limit=30" || echo "usgs failed"
          curl -sSL -A "$UA" -o emsc-sample.json \
            "https://www.seismicportal.eu/fdsnws/event/1/query?format=json&minlat=27&maxlat=36&minlon=32&maxlon=38&minmag=2&limit=30" || echo "emsc failed"
          ls -la

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fetch: ${{ steps.task.outputs.tasks }}"
            git push
          fi
