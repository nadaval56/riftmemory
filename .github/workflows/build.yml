name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # רענון הרעידות האחרונות גם בכל בנייה (בלי commit), כי ה-schedule של live.yml לא תמיד רץ בזמן
      - name: fetch live
        continue-on-error: true
        run: |
          cd scripts
          python fetch_live.py
          python echo.py
      - id: pages
        uses: actions/configure-pages@v5
      - name: build site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python scripts/build_events.py
          python scripts/build_site.py
      - name: checks (docs/guide.pdf, פרק 10)
        run: cd scripts && python check_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
