# פעם בחודש: משיכה מחדש של קטלוגי הרעידות לדף "מכשירי מדידה" (USGS מ-1900, והמכון הגיאולוגי).
# הקבצים נשמרים ב-data/catalog. commit של GITHUB_TOKEN לא מפעיל את build.yml,
# אבל live.yml בונה ומפרסם את האתר בריצה הבאה שלו (בתוך שעה בערך).
name: catalog

on:
  schedule:
    - cron: "43 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_catalog.py
      - name: checks
        run: |
          python scripts/build_events.py
          python scripts/build_site.py
          cd scripts && python check_site.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/catalog
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "catalog: עדכון חודשי של קטלוגי הרעידות"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
